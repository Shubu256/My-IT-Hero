<div class="page-head"><div><h1>Where do I enter this?</h1><p>Every value in your return, with the ITR form, schedule and portal field it belongs to.</p></div>
  <a class="btn" href="https://www.incometax.gov.in/iec/foportal/" target="_blank" rel="noopener noreferrer">Open Income Tax e-Filing Portal</a></div>
<div class="notice warning" id="map-disclaimer"><p>Portal labels and navigation may change. Verify the field against the current Income Tax Department e-Filing portal before submission.</p></div>
<section class="panel">
  <form class="searchbar" id="map-search" role="search">
    <label class="sr-only" for="q">Search</label><input type="search" id="q" placeholder="Search: salary, TDS, 80C, home loan, dividend…" autocomplete="off">

    <button class="btn" type="submit">Search</button>
  </form>
  <div class="tagline" id="tags"></div>
</section>

<div id="map-list"></div>
