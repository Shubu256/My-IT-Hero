<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — my IT Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="app-header"></header>
<main id="main">
<div class="auth-wrap">
  <div class="panel" id="step-request">
    <h1>Reset your password</h1>
    <p class="muted">This browser-only edition can't email reset codes. Enter your email to see your options.</p>
    <div id="msg"></div>
    <form id="req-form" novalidate>
      <div class="field"><label for="identifier">Email or mobile number</label><input id="identifier" name="identifier" type="text" autocomplete="username" required></div>
      <button class="btn" type="submit">Send reset code</button>
    </form>
  </div>
  <div class="panel hidden" id="step-reset">
    <h1>Choose a new password</h1>
    <div id="reset-msg"></div>
    <form id="reset-form" novalidate>
      <div class="field"><label for="code">6-digit code</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
      <div class="field"><label for="password">New password<span class="hint">At least 10 characters with a letter and a number.</span></label><input id="password" name="password" type="password" autocomplete="new-password"></div>
      <button class="btn" type="submit">Change password</button>
    </form>
  </div>
</div>
</main>
<footer class="site" id="app-footer"></footer>
<script src="rules-data.js"></script>
<script src="engine.js"></script>
<script src="entities.js"></script>
<script src="validators.js"></script>
<script src="forms.js"></script>
<script src="ocr.js"></script>
<script src="worksheet.js"></script>
<script src="local-api.js"></script>
<script src="app.js"></script>
<script src="flow.js"></script>
<script src="page-reset.js"></script>
</body>
</html>
