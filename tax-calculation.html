<section class="panel"><h2>Recommended ITR form</h2><div id="itr"></div></section>
<section class="panel"><div class="section-title"><h2 id="breakdown-title">Full breakdown</h2>
  <label class="sr-only" for="bd-regime">Regime</label><select id="bd-regime"><option value="new">New regime</option><option value="old">Old regime</option></select></div>
  <div id="warn-list"></div><div class="table-wrap"><table id="breakdown"><thead><tr><th>Step</th><th class="num">Amount</th><th>Rule status</th></tr></thead><tbody></tbody></table></div></section>
</main>
